seed: 42
run_id: vlact_robodojo_oft
run_root_dir: results/RoboDojo
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: /mnt/xiaoyu_ssd_intern/pretrained_checkpoints/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: MLP
    action_dim: 14
    state_dim: 14
    action_horizon: 50
    future_action_window_size: 49
    past_action_window_size: 0
  obs_image_size: [224, 224]
datasets:
  vqa_data:
    enabled: false
    loss_weight: 0.1
    per_device_batch_size: 1
    num_workers: 0
  vla_data:
    dataset_py: robodojo_cache
    data_mix: robodojo_arx_x5_h50_q99
    cache_dir: results/RoboDojo/data_full
    source_override: null
    per_device_batch_size: 8
    num_workers: 4
    include_state: false
    action_mode: abs
    image_size: [224, 224]
    obs_image_size: [224, 224]
    video_backend: pyav
trainer:
  pretrained_checkpoint: /mnt/xiaoyu_ssd_intern/pretrained_checkpoints/VLAct_Qwen3_Pretrain/checkpoints/steps_100000_pytorch_model.pt
  reload_modules: qwen_vl_interface
  random_init_action_model: true
  reset_steps: true
  freeze_modules: ''
  enable_gradient_checkpointing: true
  max_train_steps: 30000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 500
  logging_frequency: 10
  eval_batches: 8
  gradient_accumulation_steps: 2
  gradient_clipping: 1.0
  learning_rate:
    base: 1.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
